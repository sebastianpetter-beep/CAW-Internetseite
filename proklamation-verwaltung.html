<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Proklamation Verwaltung | CAW</title><style>:root{--r:#be2c24}*{box-sizing:border-box}body{font-family:system-ui;margin:0;background:#f4f4f4}.wrap{max-width:1250px;margin:auto;padding:20px}.card{background:white;padding:20px;border-radius:16px;margin:15px 0;box-shadow:0 5px 20px #0001}input,button{padding:11px;border-radius:9px;border:1px solid #bbb}button{background:var(--r);color:#fff;border:0;font-weight:700;cursor:pointer}.stats{display:flex;gap:10px;flex-wrap:wrap}.stat{background:#f6eeee;padding:12px;border-radius:10px;min-width:140px}table{width:100%;border-collapse:collapse;font-size:.9rem}th,td{padding:9px;border-bottom:1px solid #ddd;text-align:left;vertical-align:top}.actions button{margin:2px;font-size:.78rem}.green{background:#287a3e}.gray{background:#666}.blue{background:#245c9c}.pill{display:inline-block;padding:3px 7px;border-radius:999px;background:#eee;font-size:.78rem}.names{font-size:.82rem;color:#555;margin-top:4px}@media(max-width:800px){table{display:block;overflow:auto}}</style></head><body><main class="wrap"><h1>CAW · Proklamation Verwaltung</h1><section id="login" class="card"><h2>Geschützter Bereich</h2><input id="pw" type="password" placeholder="Passwort"><button onclick="loginNow()">Anmelden</button><p id="lm"></p></section><div id="app" hidden><section class="card stats" id="stats"></section><section class="card"><button onclick="load()">Aktualisieren</button> <button class="gray" onclick="window.open(API+'/api/admin/guestlist.pdf?token='+encodeURIComponent(token))">PDF-Gästeliste</button><div style="overflow:auto"><table><thead><tr><th>Vorgang</th><th>Kontakt / Gäste</th><th>Verein</th><th>Plätze</th><th>Status</th><th>Frist</th><th>Aktion</th></tr></thead><tbody id="rows"></tbody></table></div></section></div></main><script>const API='https://caw-proklamation-backend.onrender.com';let token=sessionStorage.prokToken||'';const labels={pending:'Prüfung läuft',payment_pending:'Zahlung offen',paid:'Bezahlt',ticket_sent:'Ticket versendet',checked_in:'Eingecheckt',cancelled:'Storniert',waitlist:'Warteliste'};async function loginNow(){let r=await fetch(API+'/api/admin/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:pw.value})}),j=await r.json();if(!r.ok){lm.textContent=j.error||'Anmeldung fehlgeschlagen';return}token=j.token;sessionStorage.prokToken=token;show()}async function show(){login.hidden=true;app.hidden=false;await load()}function esc(v=''){return String(v).replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]))}async function load(){let r=await fetch(API+'/api/admin/requests',{headers:{authorization:'Bearer '+token}});if(r.status===401){sessionStorage.removeItem('prokToken');location.reload();return}let j=await r.json();stats.innerHTML=`<div class=stat><b>${j.summary.totalSeats}</b><br>reservierte Plätze</div><div class=stat><b>${j.summary.paidSeats}</b><br>bezahlt / Ticket</div><div class=stat><b>${j.summary.checkedInSeats}</b><br>eingecheckt</div><div class=stat><b>${j.summary.capacity-j.summary.totalSeats}</b><br>noch verfügbar</div>`;rows.innerHTML=j.items.map(x=>{let gs=Array.isArray(x.guest_names)?x.guest_names:[];let names=gs.map(g=>esc(g.firstName+' '+g.lastName)).join('<br>');let acts='';if(x.status==='payment_pending')acts=`<button class=green onclick="act('${x.id}','paid')">Zahlung eingegangen</button><button class=gray onclick="act('${x.id}','cancelled')">Stornieren</button>`;if(x.status==='ticket_sent')acts=`<button class=blue onclick="act('${x.id}','checkin')">Einchecken</button><button onclick="act('${x.id}','resend')">Ticket erneut senden</button><button class=gray onclick="act('${x.id}','cancelled')">Stornieren</button>`;if(x.status==='waitlist')acts=`<button class=green onclick="act('${x.id}','approve_waitlist')">Freigeben</button><button class=gray onclick="act('${x.id}','cancelled')">Ablehnen</button>`;return `<tr><td>${esc(x.reference)}</td><td>${esc(x.first_name+' '+x.last_name)}<br><small>${esc(x.email)}</small><div class=names>${names}</div></td><td>${esc(x.club||'—')}</td><td>${x.seats}</td><td><span class=pill>${labels[x.status]||esc(x.status)}</span></td><td>${x.payment_deadline?new Date(x.payment_deadline).toLocaleDateString('de-DE'):'—'}</td><td class=actions>${acts}</td></tr>`}).join('')}async function act(id,a){if(!confirm('Aktion wirklich ausführen?'))return;let r=await fetch(API+'/api/admin/action',{method:'POST',headers:{authorization:'Bearer '+token,'content-type':'application/json'},body:JSON.stringify({id,action:a})}),j=await r.json();if(!r.ok)alert(j.error||'Fehler');else load()}if(token)show();</script></body></html>
