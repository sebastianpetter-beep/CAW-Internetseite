name: Proklamation-Verwaltung Syntax
on:
  push:
    branches:
      - feature/proklamation-freikarten-verwaltung
  pull_request:
    branches:
      - main
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract and check inline JavaScript
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import vm from 'node:vm';
          const html = fs.readFileSync('proklamation-verwaltung.html', 'utf8');
          const scripts = [...html.matchAll(/<script(?:\\s[^>]*)?>([\\s\\S]*?)<\\/script>/g)];
          if (!scripts.length) throw new Error('Kein Inline-Script gefunden');
          for (const [i, match] of scripts.entries()) new vm.Script(match[1], {filename: 'admin-inline-'+i+'.js'});
          console.log(scripts.length + ' Script(s) syntaktisch korrekt');
          NODE
